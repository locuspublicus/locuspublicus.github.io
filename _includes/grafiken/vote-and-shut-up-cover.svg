<text x="60" y="732" fill="#ead7b7" font-size="28">Ninety seconds of power every four years.</text>
<text x="60" y="768" fill="#ead7b7" font-size="28">Athens would have called it oligarchy.</text>
<text x="1140" y="768" fill="#e08a3c" font-size="18" letter-spacing="4" text-anchor="end">BY HAKBARD</text>
