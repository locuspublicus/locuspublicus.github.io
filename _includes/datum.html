{%- assign monate = "Januar,Februar,März,April,Mai,Juni,Juli,August,September,Oktober,November,Dezember" | split: "," -%}
{%- assign m = include.date | date: "%-m" | minus: 1 -%}
<time class="datum" datetime="{{ include.date | date_to_xmlschema }}">{{ include.date | date: "%-d" }}. {{ monate[m] }} {{ include.date | date: "%Y" }}</time>
