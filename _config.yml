# ============================================
# Grundeinstellungen deines Blogs
# Ersetze DEIN-GITHUB-NAME durch deinen GitHub-Benutzernamen
# ============================================

title: Locus Publicus
untertitel: A Public Space for Modern Day Madness
description: >-
 Thoughts about modern day madness and personal psychotherapy.
author: Hakbard
email: hakbardcelion@proton.me

url: "https://locuspublicus.github.io"
baseurl: ""

lang: en
timezone: Europe/Berlin

# Menü unter dem Titel (Reihenfolge hier ändern)
navigation:
  - titel: Posts
    url: /
  - titel: About
    url: /about/
  - titel: Subscribe
    url: /subscribe/

# Erweiterungen: RSS-Feed, Google-freundliche Meta-Daten, Sitemap
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Beitragsadressen: /2026/11/23/titel/
permalink: /:year/:month/:day/:title/

# RSS/Atom-Feed: nur Teaser + Link, keine kompletten Beiträge mit Grafiken.
# Die lesbare Ansicht im Browser kommt aus feed.xslt.xml.
feed:
  excerpt_only: true

show_excerpts: true

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
