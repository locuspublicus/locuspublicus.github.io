# ============================================
# Grundeinstellungen deines Blogs
# Ersetze DEIN-GITHUB-NAME durch deinen GitHub-Benutzernamen
# ============================================

title: Locus Publicus
untertitel: Ein öffentlicher Ort für Gedanken
description: >-
  Gedanken über Business Development, KI und ein klareres, gesünderes Leben.
author: Alexis
email: deine@email.de

url: "https://DEIN-GITHUB-NAME.github.io"
baseurl: ""

lang: de
timezone: Europe/Berlin

# Menü unter dem Titel (Reihenfolge hier ändern)
navigation:
  - titel: Beiträge
    url: /
  - titel: Über mich
    url: /ueber-mich/

# Erweiterungen: RSS-Feed, Google-freundliche Meta-Daten, Sitemap
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Beitragsadressen: /2026/11/23/titel/
permalink: /:year/:month/:day/:title/

show_excerpts: true

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
